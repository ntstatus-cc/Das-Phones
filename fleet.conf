# Fleet config: every phone set up with `--remote <raw URL of this file>`
# mines whatever is written here. Edit this file on GitHub and the phones
# switch within ~15 minutes (CHECK_MIN on each phone). Only these keys are read:
# ALGO, POOL, WALLET, PASS, THREADS, AFFINITY, EXTRA. Nothing here is executed.
#
# Per-phone THREADS / AFFINITY / WORKER set with `miner set` override this file.

ALGO=yespoweradvc
POOL=stratum+tcp://POOL_HOST:PORT
WALLET=YOUR_ADVC_ADDRESS
PASS=x

# Other phone coins this build supports (swap the three lines above):
#   Yenten       ALGO=yespowerr16
#   UraniumX     ALGO=yespowerurx
#   EquityPay    ALGO=yespowereqpay
#   Verus        ALGO=verus
#   MicroBitcoin ALGO=power2b
